<text x="930" y="559" text-anchor="middle" class="sub">1000</text>
<text x="28" y="108" class="name">guide</text>
<text x="28" y="130" class="sub">4.9 KiB</text>
<text x="150" y="154" class="engine">JavaScript</text>
