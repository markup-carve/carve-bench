[package]
name = "carve-bench-rs"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# carve-rs engine, published as the `carve-lang` crate (aliased here as `carve`,
# so the harness keeps `use carve`). The requirement is EXACT (`=`), not the
# caret Cargo would infer from a bare version: the JS and PHP lanes name one
# published release each and cannot walk to another, and comparability is this
# repo's product, so the Rust lane must not move under `cargo update` either.
# Override with a path for local development:
#   cargo build --release --config 'patch.crates-io.carve-lang.path="../../../carve-rs"'
# or set [patch] in a workspace. See README.
carve = { package = "carve-lang", version = "=0.1.3" }
comrak = { version = "0.54.0", default-features = false }
jotdown = "0.10.0"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }

[[bin]]
name = "carve-bench-rs"
path = "src/main.rs"

[[bin]]
name = "carve-bench-rs-compare"
path = "src/compare.rs"

[profile.release]
opt-level = 3
lto = true
