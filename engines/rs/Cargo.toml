[package]
name = "carve-bench-rs"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
# Carve 0.2 is the carve-rs checkout that scripts/fetch.mjs pins; Carve 0.1 is the crates.io release (a
# second path dependency of the same name and version would collide in the lockfile).
carve01 = { package = "carve-lang", version = "=0.1.14" }
carve = { package = "carve-lang", path = "../../.engines/carve-rs" }
comrak = { version = "=0.54.0", default-features = false }
jotdown = "=0.10.0"
pulldown-cmark = { version = "=0.13.4", default-features = false, features = ["html"] }
serde_json = "1"

# The release profile of carve-rs.
[profile.release]
lto = "thin"
codegen-units = 1
