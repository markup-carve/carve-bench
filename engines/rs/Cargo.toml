[package]
name = "carve-bench-rs"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
# Both Carve engines come from the carve-rs checkout that scripts/fetch.mjs pins.
carve = { package = "carve-lang", path = "../../.engines/carve-rs" }
carve2 = { path = "../../.engines/carve-rs/v2" }
comrak = { version = "=0.54.0", default-features = false }
jotdown = "=0.10.0"
pulldown-cmark = { version = "=0.13.4", default-features = false, features = ["html"] }
serde_json = "1"

# The release profile of carve-rs.
[profile.release]
lto = "thin"
codegen-units = 1
