name: Benchmark site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: benchmark-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Every job declares timeout-minutes so a hung step fails in minutes
# rather than inheriting the 360-minute GitHub default.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build from committed measurements
        run: |
          python3 -m unittest discover -s scripts/history -p 'test_*.py'
          node --test scripts/site/build.test.mjs
          node scripts/site/build.mjs
      - name: Install browser test dependencies
        working-directory: site
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy benchmark site
        id: deployment
        uses: actions/deploy-pages@v4
